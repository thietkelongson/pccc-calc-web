<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>PCCC Calc — Bản preview tổng thể</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0b1220; color: #e2e8f0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

  .preview-bar {
    background: #1f2937; border-bottom: 1px solid #334155;
    padding: 8px 16px; display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
  }
  .preview-bar .brand {
    font-size: 13px; font-weight: 700; color: #fbbf24;
    display: flex; align-items: center; gap: 8px;
  }
  .preview-bar .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  .preview-bar .sep { width: 1px; height: 20px; background: #334155; margin: 0 4px; }

  .preview-bar .tabs { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  .preview-tab {
    background: transparent; border: 1px solid #334155;
    color: #cbd5e1; padding: 5px 12px; border-radius: 6px;
    font-size: 12px; cursor: pointer; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .preview-tab:hover { background: #334155; }
  .preview-tab.active { background: #c0392b; color: white; border-color: #c0392b; }

  .preview-bar .actions { display: flex; gap: 6px; margin-left: auto; align-items: center; }
  .preview-bar .actions button, .preview-bar .actions a {
    background: #334155; border: none; color: #cbd5e1;
    padding: 5px 10px; border-radius: 5px; font-size: 11px;
    cursor: pointer; font-weight: 600; text-decoration: none;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .preview-bar .actions button:hover, .preview-bar .actions a:hover { background: #475569; color: white; }

  /* Sub-info bar */
  .info-bar {
    background: #0f172a; border-bottom: 1px solid #1f2937;
    padding: 6px 16px; font-size: 11.5px; color: #94a3b8;
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .info-bar .label { color: #64748b; }
  .info-bar b { color: #fbbf24; font-family: monospace; }
  .info-bar .meta { margin-left: auto; }
  .info-bar .meta b { color: #cbd5e1; }

  .frame-wrap { flex: 1; position: relative; background: white; }
  iframe {
    width: 100%; height: 100%; border: none;
    display: none; background: white;
  }
  iframe.active { display: block; }

  /* Loading shimmer when iframe reloads */
  .reload-indicator {
    position: absolute; top: 12px; right: 12px;
    background: rgba(0,0,0,.7); color: #fbbf24;
    padding: 6px 12px; border-radius: 6px; font-size: 11px;
    display: none; z-index: 50;
  }
  .reload-indicator.show { display: block; animation: fadeOut 1.5s forwards; }
  @keyframes fadeOut { 70% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>

<div class="preview-bar">
  <div class="brand"><span class="dot"></span> PCCC Calc — Preview</div>
  <div class="sep"></div>
  <div class="tabs" id="tabs">
    <button class="preview-tab active" data-frame="landing" data-desc="Trang chủ Apple style — typography lớn, iOS icons, frosted nav" data-file="index.html">🏠 Landing</button>
    <button class="preview-tab" data-frame="login" data-desc="Đăng nhập — email/password + social + remember + quên MK" data-file="login.html">🔑 Đăng nhập</button>
    <button class="preview-tab" data-frame="signup" data-desc="Đăng ký — role selector, strength bar, tặng 5 credit demo" data-file="signup.html">📝 Đăng ký</button>
    <button class="preview-tab" data-frame="forgot" data-desc="Quên mật khẩu — 2 state: form + 'đã gửi email reset'" data-file="forgot-password.html">🔐 Quên MK</button>
    <button class="preview-tab" data-frame="dash" data-desc="Dashboard sau đăng nhập — credit, stats, 9 module, dự án" data-file="dashboard.html">📊 Dashboard</button>
    <button class="preview-tab" data-frame="qc10" data-desc="Tra cứu QC10 — Bảng A.1/B.1/G.1 QCVN 10:2025/BCA, 31 loại nhà" data-file="qc10-lookup.html">📖 Tra cứu QC10</button>
    <button class="preview-tab" data-frame="sprink" data-desc="Module Thủy lực TCVN 7336 — sơ đồ Isometric 3D, Pipenet style" data-file="sprinkler-network.html">💧 Sprinkler Iso</button>
  </div>
  <div class="actions">
    <button onclick="reloadCurrent()" title="Tải lại trang đang xem">🔄 Reload</button>
    <a id="openNew" href="index.html" target="_blank" title="Mở tab mới">↗ Tab mới</a>
    <a href="PROJECT_NOTES.md" target="_blank">📄 Notes</a>
    <a href="WORKFLOW.md" target="_blank">📋 Workflow</a>
  </div>
</div>

<div class="info-bar">
  <span class="label">Đang xem:</span> <b id="curFile">index.html</b>
  <span style="opacity:.6">—</span>
  <span id="curDesc">Trang chủ public — giới thiệu, 9 tính năng, CTA đăng ký</span>
  <div class="meta">v1.0.0-beta • <b>07/06/2026</b></div>
</div>

<div class="frame-wrap">
  <iframe id="frame-landing" class="active" src="index.html"></iframe>
  <iframe id="frame-login" src="login.html"></iframe>
  <iframe id="frame-signup" src="signup.html"></iframe>
  <iframe id="frame-forgot" src="forgot-password.html"></iframe>
  <iframe id="frame-dash" src="dashboard.html"></iframe>
  <iframe id="frame-qc10" src="qc10-lookup.html"></iframe>
  <iframe id="frame-sprink" src="sprinkler-network.html"></iframe>
  <div class="reload-indicator" id="reloadInd">🔄 Đã tải lại</div>
</div>

<script>
  const tabs = document.querySelectorAll('.preview-tab');
  const curFile = document.getElementById('curFile');
  const curDesc = document.getElementById('curDesc');
  const openNew = document.getElementById('openNew');

  tabs.forEach(t => {
    t.addEventListener('click', () => {
      tabs.forEach(x => x.classList.remove('active'));
      document.querySelectorAll('iframe').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('frame-' + t.dataset.frame).classList.add('active');
      curFile.textContent = t.dataset.file;
      curDesc.textContent = t.dataset.desc;
      openNew.href = t.dataset.file;
    });
  });

  function reloadCurrent() {
    const activeTab = document.querySelector('.preview-tab.active');
    const f = document.getElementById('frame-' + activeTab.dataset.frame);
    f.src = f.src;
    const ind = document.getElementById('reloadInd');
    ind.classList.remove('show');
    void ind.offsetWidth; // restart animation
    ind.classList.add('show');
  }

  // Ctrl+R / F5 to reload current iframe (not whole page)
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
      e.preventDefault();
      reloadCurrent();
    }
  });
</script>
</body>
</html>
